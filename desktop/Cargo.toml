[workspace]
members = ["ox-desktop", "ox-desk-core", "ox-desk-probe", "ox-host", "ox-host-protocol", "ox-host-service", "ox-host-web", "ox-pty"]
default-members = ["ox-desktop"]
resolver = "3"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["profiler"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland", "x11"] }
gpui-component = { version = "=0.10.0", features = ["tree-sitter-bash", "tree-sitter-rust", "tree-sitter-python"] }

[profile.dev]
debug = 0
