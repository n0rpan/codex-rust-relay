[package]
name = "ox-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ox-desk-core = { path = "../ox-desk-core" }
ox-host-service = { path = "../ox-host-service" }
ox-host-web = { path = "../ox-host-web", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
reqwest = {version="0.12",default-features=false,features=["blocking"]}
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
