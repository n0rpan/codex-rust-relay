# Quarantined window tests. See desktop/ci/quarantine.py and the flake rule
# at the top of .github/workflows/desktop.yml.
#
# A quarantined test still runs, blocking, in the nightly schedule, manual runs
# and tags (release builds). On branches, pull requests and main it is skipped
# with a notice. Every entry names its tracking issue and expires within 30
# days; the fast lane fails on an expired entry. Remove the entry when the
# issue closes.
#
# [[test]]
# name = "host_continuity_window"      # desktop/tests/<name>.py or a gate scenario set
# runners = ["ubuntu-24.04-arm"]       # optional; default: every runner
# issue = 123                          # required: github.com/oxstack/ox/issues/123
# until = 2026-12-24                  # required, at most 30 days ahead
# reason = "transcript find not opened by xdotool ctrl+f on ARM"
