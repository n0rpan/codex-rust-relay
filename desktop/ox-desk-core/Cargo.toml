[package]
name = "ox-desk-core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
libc = "0.2"
ox-memory = { path = "../ox-memory" }

tempfile = "3"
